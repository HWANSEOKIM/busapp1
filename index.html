<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국민대학교 등하교 버스 혼잡도 예측 어플</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--sub:#6b7686;--line:#e3e8ef;--pri:#1e5eff;
--c1:#22a35a;--c2:#e0a800;--c3:#f06a1d;--c4:#d93636;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--tx:#e8edf4;--sub:#93a0b3;--line:#2a3340;--pri:#6b95ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a212b;--tx:#e8edf4;--sub:#93a0b3;--line:#2a3340;--pri:#6b95ff;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:24px;font-weight:800;line-height:1.25;margin:4px 0 4px;flex:1;min-width:0;word-break:keep-all}
.sub{color:var(--sub);font-size:13px}
.nav{display:flex;gap:6px;background:var(--line);border-radius:12px;padding:4px;margin-top:12px}
.nav a{flex:1;text-align:center;padding:9px 0;border-radius:9px;color:var(--sub);text-decoration:none;font-weight:700;font-size:14px}
.nav a.on{background:var(--card);color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.tabs{display:flex;gap:8px;margin-top:12px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 0;font-size:16px;font-weight:700;cursor:pointer}
.tab[aria-selected=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
label{font-size:13px;color:var(--sub);display:block;margin:10px 0 4px}
select,button.act{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:15px}
button.act{background:var(--pri);color:#fff;border:0;font-weight:700;cursor:pointer;margin-top:14px}
button.del{border:1px solid var(--line);background:none;color:var(--c4);border-radius:8px;padding:4px 10px;cursor:pointer}
.bus{display:flex;gap:12px;align-items:flex-start}
.badge{min-width:68px;text-align:center;border-radius:10px;padding:8px 4px;color:#fff;font-weight:700;font-size:14px}
.l1{background:var(--c1)}.l2{background:var(--c2)}.l3{background:var(--c3)}.l4{background:var(--c4)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%}
.info{font-size:14px;margin-top:4px}
.warn{background:rgba(217,54,54,.1);border:1px solid var(--c4);border-radius:10px;padding:10px;font-size:14px;margin-top:10px}
.rec{background:rgba(34,163,90,.1);border:1px solid var(--c1);border-radius:10px;padding:10px;font-size:14px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 4px;font-size:13px;cursor:pointer}.seg button[aria-selected=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.path{font-size:12px;color:var(--sub);margin-top:6px}.path b{color:var(--pri)}
.plate{font-size:12px;color:var(--sub);margin-left:4px}.arr{font-size:15px;margin-top:3px}.arr .now{font-size:18px;font-weight:800;color:var(--c4)}.arr .eta{font-size:18px;font-weight:800}.hint{font-size:12px;color:var(--sub);margin-top:6px}.ghost{width:100%;margin-top:8px;padding:8px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--pri);font-size:13px;cursor:pointer}
.rbtn{flex-shrink:0;border:1px solid var(--pri);background:var(--card);color:var(--pri);border-radius:18px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;margin-top:2px}.rbtn:active{background:var(--pri);color:#fff}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,calc((100vw - 720px)/2)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--sub);font-size:12px;font-weight:700;padding:4px 2px;border-radius:10px}
.tabbar a i{display:block;font-style:normal;font-size:20px;line-height:1.2}
.tabbar a.on{color:var(--pri)}
main{padding-bottom:96px}
.hero{text-align:center;padding:22px 14px}.hero h2{margin:6px 0 4px;font-size:20px}
.bigbtn{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;margin-top:10px}
.bigbtn.alt{background:var(--card);color:var(--pri);border:1px solid var(--pri)}
.hrow{cursor:pointer}.steps{margin:8px 0 0;padding-left:18px;font-size:14px}.steps li{margin:4px 0}
.regbox{margin-top:10px;padding:10px;background:var(--bg);border-radius:10px}.regbox .row:last-child{border-bottom:0}
.htab{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;margin-top:6px}
.htab th{color:var(--sub);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px}
.htab td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left}
.htab tr:last-child td{border-bottom:0}
.htab th:last-child,.htab td:last-child{text-align:center}
.htab .seat{font-size:18px}.htab .none{color:var(--line)}
.herocard{padding:0;overflow:hidden}.heroimg{position:relative;line-height:0}.heroimg img{display:block;width:100%;height:auto}
.heroov{position:absolute;left:0;right:0;top:0;padding:12px 16px 46px;line-height:1.4;color:#fff;background:linear-gradient(to bottom,rgba(8,28,70,.78),rgba(8,28,70,0));text-shadow:0 1px 3px rgba(0,0,0,.55)}
.heroov h2{margin:0 0 3px;font-size:21px}.heroov div{font-size:13px}
.herobtns{padding:4px 14px 14px}
.bno{display:inline-block;min-width:50px;padding:3px 9px;margin-bottom:3px;border-radius:7px;background:#1f9d55;color:#fff;font-weight:800;font-size:15px;text-align:center;letter-spacing:.3px}
.ctab col:nth-child(1){width:46%}.ctab col:nth-child(2){width:28%}.ctab col:nth-child(3){width:26%}
.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:22px;cursor:pointer}.stepper input{width:72px;height:44px;text-align:center;font-size:18px;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.tag{background:var(--pri);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:4px}
.note{font-size:12px;color:var(--sub);margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none}
</style>
</head>

const CAP=70, SEATS=27;
const LEVELS=[{max:38,cls:"l1",name:"여유",col:"var(--c1)"},{max:57,cls:"l2",name:"보통",col:"var(--c2)"},{max:95,cls:"l3",name:"혼잡",col:"var(--c3)"},{max:999,cls:"l4",name:"만차",col:"var(--c4)"}];

const key=(r,d)=>r+"|"+d;
let seed=7; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const BUSES={};
let CURSEED=7;
function genBuses(sd){seed=sd;Object.keys(ROUTES).forEach(r=>ROUTES[r].forEach((D,d)=>{
  BUSES[key(r,d)]=[0,1].map(i=>{
    const R=D.ref, drops={};
    // 시나리오: normal(여유~보통) / crowded(혼잡, 하차 적음) / full(만차) / heavy(혼잡하지만 곧 많이 내려 탑승 가능)
    const rr=rnd(); let sc;
    if(sd===7) sc=(r==="1020"&&d===0&&i===0)?"full":(r==="1711"&&d===0&&i===0)?"heavy":(r==="7211"&&d===0&&i===0)?"fullheavy":"normal";
    else sc=rr<0.22?"heavy":rr<0.45?"crowded":rr<0.55?"full":rr<0.60?"fullheavy":"normal";
    let pct=Math.floor(20+rnd()*38); // 20~57% (여유·보통)
    if(sc==="full"||sc==="fullheavy") pct=96+Math.floor(rnd()*5);
    if(sc==="crowded") pct=76+Math.floor(rnd()*20);
    if(sc==="heavy") pct=74+Math.floor(rnd()*6);
    const pass=Math.round(CAP*pct/100);
    // 정류장별 하차 예정: 0~10명 (탑승 인원을 넘지 않도록)
    let left=pass;
    for(let s=R;s<D.stops.length;s++){const v=Math.min(left,Math.floor(rnd()*11)); drops[s]=v; left-=v;}
    if(sc==="fullheavy"){ // 만차지만 곧 많은 승객이 내리는 경우
      drops[R]=9+Math.floor(rnd()*2); drops[R+1]=9+Math.floor(rnd()*2); drops[R+2]=8+Math.floor(rnd()*3);
    }
    if(sc==="heavy"){
      drops[R]=Math.min(pass,9+Math.floor(rnd()*2));
      const standing=Math.max(0,pass-drops[R]-SEATS);
      drops[R+1]=Math.min(10,Math.ceil((standing+1)*(0.55+rnd()*0.2)));
      drops[R+2]=Math.min(10,Math.max(0,standing+1-drops[R+1])+Math.floor(rnd()*2));
    }
    const away=i===0?1+Math.floor(rnd()*2):3+Math.floor(rnd()*3); const plate="서울70사"+(1000+Math.floor(rnd()*8999));
    return {id:key(r,d)+"-"+i,no:i+1,away,eta:away*2,plate,pct,drops};
  });
}));}

function seatInfo(b,r,d){
  const D=ROUTES[r][d], st=D.stops, bi=b.no-1, REF=D.ref;
  const pass=Math.round(CAP*b.pct/100)-dropsOf(r,d,bi,REF); // 국민대학교앞에서 내리는 승객 제외
  const standing=Math.max(0,pass-SEATS);
  if(!standing) return {stops:0,standing:0};
  let cum=0;
  for(let s=REF+1;s<st.length;s++){cum+=dropsOf(r,d,bi,s); if(cum>=standing+1) return {stops:s-REF,stop:st[s],cum,standing};}
  return {stops:null,standing};
}
function seatForecast(b,r,d){
  const i=seatInfo(b,r,d);
  if(i.stops===0) return "국민대학교앞에서 타면 앉을 자리가 있어요 💺";
  if(i.stops===null) return "국민대학교앞 탑승 시 끝까지 서서 갈 가능성이 커요";
  return `국민대학교앞 탑승 기준, 약 ${i.stops}정거장 뒤(${i.stop})부터 앉을 수 있어요`;
}
const goodCrowd=(b,r,d)=>{
  const L=lvl(b.pct).name; if(L!=="혼잡"&&L!=="만차")return null;
  const i=seatInfo(b,r,d);
  if(i.stops!==null&&i.stops>0&&i.stops<=2) return {...i,kind:"seat"};
  if(L==="만차"){ // 만차라도 국민대학교앞~2정거장 뒤에 많이 내리면 곧 자리가 남
    const D=ROUTES[r][d], R=D.ref, bi=b.no-1, E=Math.min(R+2,D.stops.length-1);
    let t=0; for(let s=R;s<=E;s++) t+=dropsOf(r,d,bi,s);
    if(t>=24) return {kind:"many",total:t,first:dropsOf(r,d,bi,R),stop:D.stops[E],n:E-R};
  }
  return null;
};
function recommend(r0,d0,cur){
  const g=ROUTES[r0][d0].g; let best=null;
  Object.keys(ROUTES).forEach(r=>ROUTES[r].forEach((D,d)=>{ if(D.g!==g)return;
    BUSES[key(r,d)].forEach(b=>{ if(b.id===cur.id||b.pct>95||b.pct>=cur.pct)return; if(!best||b.pct<best.pct) best={route:r,dirName:D.name,pct:b.pct,b}; });}));
  return best;
}

  if(!C.apiKey||C.apiKey.includes("여기에")){WHY="apiKey가 아직 입력되지 않았어요";setConn();return;}
  if(!C.appId||C.appId.includes("여기에")){WHY="appId가 아직 입력되지 않았어요";setConn();return;}
  if(!C.databaseURL||!/^https:\/\/.+\.(firebasedatabase\.app|firebaseio\.com)\/?$/.test(C.databaseURL)){WHY="databaseURL 형식이 올바르지 않아요";setConn();return;}
  try{
    firebase.initializeApp(C); FB=firebase.database();
    WHY="서버 응답을 기다리는 중이에요(안 바뀌면 databaseURL·규칙 게시를 확인)";
    FB.ref(".info/connected").on("value",sn=>{
      ONLINE=!!sn.val();
      if(ONLINE){WHY="";const p=FB.ref("presence/"+CID); p.onDisconnect().remove(); p.set(true).catch(e=>{WHY="쓰기 거부: Firebase 규칙을 게시했는지 확인하세요 ("+e.code+")";ONLINE=false;setConn();});}
      setConn();
    });
    FB.ref("drops").on("value",sn=>{const v=sn.val()||{}; LIVE=Object.keys(v).map(k=>({id:k,...v[k]})); refresh();},
      e=>{WHY="읽기 거부: Firebase 규칙을 확인하세요 ("+e.code+")";ONLINE=false;setConn();});
    FB.ref("presence").on("value",sn=>{PEERS=sn.numChildren(); setConn();});
    FB.ref("sim/seed").on("value",sn=>{const v=sn.val(); if(v!==null&&v!==CURSEED) applySeed(v,false);},()=>{});
    if(location.search.includes("admin")){
      const n=$("top-conn"), bt=document.createElement("button");
      bt.className="del"; bt.style.marginTop="8px"; bt.textContent="🧹 전체 초기화";
      bt.onclick=()=>{ if(confirm("모든 등록을 삭제할까요?")) FB.ref("drops").remove(); };
      n.after(bt);
    }
  }catch(e){WHY="초기화 오류: "+e.message;ONLINE=false;setConn();}
}
function sessionStorageOk(){try{sessionStorage.getItem("x");return true;}catch(e){return false;}}
function gate(){
  if(sessionStorageOk()&&sessionStorage.getItem("ok")==="1"){unlock();return;}
  const g=document.createElement("div");g.id="gate";
  g.innerHTML=`<div class="card" style="max-width:510px;margin:20vh auto 0"><b>🔒 입장 코드</b><div class="sub">시연 참여 코드를 입력하세요</div><input id="pw" type="password" autocomplete="off" style="width:100%;padding:10px;margin-top:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:15px"><button class="act" id="pwgo">입장</button><div class="note" id="pwerr"></div></div>`;
  g.style.cssText="position:fixed;inset:0;background:var(--bg);z-index:50;padding:16px";
  document.body.appendChild(g);
  const go=()=>{ if($("pw").value===PASS){ try{sessionStorage.setItem("ok","1")}catch(e){} unlock(); } else $("pwerr").textContent="코드가 올바르지 않아요."; };
  $("pwgo").onclick=go; $("pw").onkeydown=e=>{if(e.key==="Enter")go();};
}
function unlock(){const g=$("gate"); if(g)g.remove(); startLive();}
document.getElementById("rand").onclick=()=>{applySeed(Math.floor(Math.random()*1000000)+8,true);toast("🎲 혼잡도를 새로 섞었어요");};
gate();
</script>
